spring.application.name=meeting_organize
server.port=8080

# ===== MariaDB =====
# 접속정보는 환경변수(DB_*)로 덮어쓸 수 있음. 미지정 시 아래 기본값 사용.
spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3307}/${DB_NAME:meeting_organize}?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rhdxhd12}
# 드라이버는 URL로 자동 추론 (로컬=MariaDB, prod 프로필=PostgreSQL)

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== File upload (.md) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== AI provider 선택 (openai | anthropic) =====
ai.provider=${AI_PROVIDER:openai}

# ===== OpenAI (GPT) =====
# API key is read from the OPENAI_API_KEY environment variable (do not hardcode secrets).
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=https://api.openai.com
# gpt-4o-mini: 저비용 모델로 토큰 비용 최소화. 필요 시 변경.
openai.model=gpt-4o-mini
openai.max-tokens=1500

# ===== Anthropic Claude =====
# API key is read from the ANTHROPIC_API_KEY environment variable (do not hardcode secrets).
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=https://api.anthropic.com
anthropic.version=2023-06-01
# Haiku by default to minimize token cost; switch to a larger model if needed.
anthropic.model=claude-haiku-4-5-20251001
anthropic.max-tokens=1500
